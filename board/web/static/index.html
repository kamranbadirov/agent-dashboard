<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Board</title>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e4e2dc;
  --working: #2f6fdb; --needs: #d9480f; --waiting: #b7791f; --done: #2b8a3e; --ended: #868e96;
  --chip: #efede8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --card: #1f1f1d; --ink: #ecebe6; --muted: #9a9890; --line: #2f2e2b;
    --working: #6b9bff; --needs: #ff8a4c; --waiting: #e3b341; --done: #57c26d; --ended: #8a8f96;
    --chip: #2a2a27;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; }
header { display: flex; align-items: baseline; gap: 16px; padding: 20px 24px 8px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
.meta { color: var(--muted); font-size: 12px; }
.filters { display: flex; gap: 8px; padding: 8px 24px 16px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.filters button.on { border-color: var(--ink); }
.filters .n { color: var(--muted); margin-left: 4px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; padding: 0 24px 32px; align-items: start; }
.col h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.card { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
.card .top { display: flex; justify-content: space-between; gap: 8px; }
.card .title { font-weight: 600; }
.card .ago { color: var(--muted); font-size: 12px; white-space: nowrap; }
.tickets { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { background: var(--chip); border-radius: 4px; padding: 1px 6px; font-size: 12px; font-family: ui-monospace, Menlo, monospace; color: var(--ink); text-decoration: none; }
.chip:hover { text-decoration: underline; }
.ticket { display: inline-flex; align-items: center; gap: 3px; }
.gh { display: inline-flex; color: var(--muted); }
.gh:hover { color: var(--ink); }
.gh.merged { color: var(--done); }
.gh.closed { color: var(--ended); }
.gh .sprite { width: 22px; height: 22px; object-fit: cover; border-radius: 50%; border: 1px solid var(--line); display: block; }
.gh:hover .sprite { border-color: var(--ink); }
.gh .plain { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; background: var(--chip); align-items: center; justify-content: center; }
.gh svg { width: 14px; height: 14px; fill: currentColor; }
.status { color: var(--c); font-weight: 600; font-size: 13px; }
.ask { background: color-mix(in srgb, var(--needs) 12%, transparent); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
.summary { color: var(--muted); font-size: 13px; }
details { font-size: 13px; }
details summary { cursor: pointer; color: var(--muted); }
details pre { white-space: pre-wrap; word-break: break-word; font: 12px/1.45 ui-monospace, Menlo, monospace; background: var(--chip); padding: 8px; border-radius: 6px; max-height: 260px; overflow: auto; }
.prs { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.pr { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.pr a { color: var(--ink); }
.badge { font-size: 11px; border-radius: 4px; padding: 0 5px; border: 1px solid var(--line); color: var(--muted); }
.badge.hot { border-color: var(--needs); color: var(--needs); font-weight: 600; }
.badge.ok { border-color: var(--done); color: var(--done); }
.badge.bad { border-color: #e03131; color: #e03131; }
.foot { display: flex; gap: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.foot a, .foot button { color: var(--muted); background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: underline; }
.card .close { background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit; padding: 0 2px; line-height: 1; }
.bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.actions { display: flex; gap: 6px; }
.card .edit { background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit; padding: 0 2px; line-height: 1; }
.card .edit:hover { color: var(--ink); }
.card .close:hover { color: #e03131; }
.empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
@media (max-width: 640px) { header, .filters, .cols { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header>
  <h1>Agent Board</h1>
  <span class="meta" id="meta">loading…</span>
</header>
<div class="filters" id="filters"></div>
<div class="cols" id="cols"></div>
<script>
const COLS = [
  { key: "your_move", label: "Needs you", color: "#22b8cf" },
  { key: "working", label: "Running", color: "#e03131" },
  { key: "reviewing", label: "PR review agents", color: "#4c6ef5" },
  { key: "in_review", label: "No action", color: "#2b8a3e" },
  { key: "done", label: "Done", color: "var(--done)" },
  { key: "ended", label: "Inactive", color: "var(--ended)" },
];
let hidden = new Set(JSON.parse(safeGet("hidden") || '["ended"]'));
function safeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

function ago(ts) {
  if (!ts) return "";
  const s = (Date.now() - new Date(ts)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}
function esc(s) { return (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function column(s) { return s.status; }

const GH_ICON = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>`;
// Same artwork each repo's deploy workflow uses as its SLACK_ICON.
const REPO_IMAGES = { pikachu: "/assets/pikachu.png", raichu: "/assets/raichu.png", charmander: "/assets/charmander.png", ditto: "/assets/ditto.png", porygon: "/assets/porygon.png", rotom: "/assets/rotom.png" };
function repoIcon(p) {
  const src = REPO_IMAGES[(p.repo || "").toLowerCase()];
  if (!src) return `<span class="plain">${GH_ICON}</span>`;
  return `<img class="sprite" alt="" loading="lazy" src="${src}" onerror="this.outerHTML='<span class=&quot;plain&quot;>'+GH_ICON.trim()+'</span>'">`;
}
function ghLink(p) {
  const label = `${p.repo}#${p.number} · ${p.state.toLowerCase()}`;
  return `<a class="gh ${p.state.toLowerCase()}" target="_blank" href="${p.url}" title="${esc(label)}" aria-label="${esc(label)}">${repoIcon(p)}</a>`;
}

function card(s, color) {
  const chips = s.tickets.map(t => `<a class="chip" target="_blank" href="https://linear.app/pheedloop/issue/${t}">${t}</a>`).join("");
  const byRepo = new Map();
  s.prs.forEach(p => { const cur = byRepo.get(p.repo); if (!cur || (cur.state !== "OPEN" && p.state === "OPEN")) byRepo.set(p.repo, p); });
  const tickets = chips + [...byRepo.values()].map(ghLink).join("");
  const status = s.status === "your_move" ? "" : `<div class="status">${COLS.find(c => c.key === s.status).label}</div>`;
  const why = s.status === "your_move" ? `<div class="ask"><b>${esc(s.reasons.join(" · "))}</b>${s.pendingQuestion ? "<br>" + esc(s.pendingQuestion) : ""}</div>` : "";
  const summary = s.summary ? `<div class="summary">${esc(s.summary)}</div>` : "";
  const last = s.lastAssistant ? `<details><summary>Last reply</summary><pre>${esc(s.lastAssistant)}</pre></details>` : "";
  const foot = [
    s.name ? `<span>${esc(s.name)}</span>` : "",
    s.gitBranch ? `<span>${esc(s.gitBranch)}</span>` : "",
    s.remoteUrl ? `<a href="${s.remoteUrl}" target="_blank">open</a>` : "",
    s.resumeCmd ? `<button data-copy="${esc(s.resumeCmd)}">copy resume</button>` : "",
  ].join("");
  const label = s.alive ? "Close agent" : "Remove card";
  return `<div class="card" style="--c:${color}">
    <div class="top"><span class="title">${esc(s.title)}</span><span class="ago">${ago(s.lastActivity)}</span></div>
    ${status}${why}${summary}${last}
    <div class="bottom"><div class="tickets">${tickets}</div><div class="actions"><button class="edit" title="Rename" aria-label="Rename" data-rename="${esc(s.sessionId)}" data-title="${esc(s.title)}" data-custom="${s.customTitle ? "1" : ""}">✎</button><button class="close" title="${label}" aria-label="${label}" data-close="${esc(s.sessionId)}" data-alive="${s.alive}" data-title="${esc(s.title)}">✕</button></div></div>
    <div class="foot">${foot}</div></div>`;
}

function render(data) {
  const groups = Object.fromEntries(COLS.map(c => [c.key, []]));
  data.sessions.forEach(s => groups[column(s)].push(s));
  document.getElementById("meta").textContent = `${data.sessions.length} sessions · updated ${new Date(data.generatedAt).toLocaleTimeString()}`;
  document.getElementById("filters").innerHTML = COLS.map(c =>
    `<button data-k="${c.key}" class="${hidden.has(c.key) ? "" : "on"}"><span class="dot" style="background:${c.color}"></span> ${c.label}<span class="n">${groups[c.key].length}</span></button>`).join("");
  document.getElementById("cols").innerHTML = COLS.filter(c => !hidden.has(c.key)).map(c =>
    `<section class="col"><h2><span class="dot" style="background:${c.color}"></span>${c.label} · ${groups[c.key].length}</h2>
     ${groups[c.key].map(s => card(s, c.color)).join("") || '<div class="empty">Nothing here.</div>'}</section>`).join("");
}

let last = null;
async function load() {
  try {
    const r = await fetch("/api/state");
    last = await r.json();
    render(last);
  } catch (e) {
    document.getElementById("meta").textContent = "server unreachable — is server.py running?";
  }
}
document.addEventListener("click", e => {
  const f = e.target.closest("[data-k]");
  if (f) { const k = f.dataset.k; hidden.has(k) ? hidden.delete(k) : hidden.add(k); safeSet("hidden", JSON.stringify([...hidden])); if (last) render(last); }
  const c = e.target.closest("[data-copy]");
  if (c) { navigator.clipboard.writeText(c.dataset.copy); c.textContent = "copied"; }
  const n = e.target.closest("[data-rename]");
  if (n) renameAgent(n);
  const x = e.target.closest("[data-close]");
  if (x) closeAgent(x);
});

async function renameAgent(btn) {
  const title = prompt(btn.dataset.custom ? "Card title (leave empty to reset)" : "Card title", btn.dataset.title);
  if (title === null) return;
  try {
    await fetch("/api/rename", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId: btn.dataset.rename, title }),
    });
  } catch (e) {
    return;
  }
  load();
}

async function closeAgent(btn) {
  const alive = btn.dataset.alive === "true";
  if (alive && !confirm(`Close this agent?\n\n${btn.dataset.title}`)) return;
  btn.textContent = "…";
  btn.disabled = true;
  try {
    const r = await fetch(alive ? "/api/close" : "/api/dismiss", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId: btn.dataset.close }),
    });
    const res = await r.json();
    if (!res.ok) { btn.textContent = "✕"; btn.disabled = false; alert(res.message); return; }
  } catch (e) {
    btn.textContent = "✕"; btn.disabled = false;
    return;
  }
  load();
}
load();
setInterval(load, 20000);
</script>
</body>
</html>
